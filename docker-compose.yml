services:
  bd:
    build: ./bd
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vestigium
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@bd:5432/vestigium
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    depends_on:
      - bd

  frontend:
    build: ./frontend
    environment:
      API_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - backend
